[project]
name = "seance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jorge Vargas", email = "jvargas2@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
modal = [
    "modal>=1.6",
]
report = [
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
